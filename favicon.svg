<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The VK monogram, traced from VK_white.png (960px master, 2020) because no vector
       source was to hand. Two closed paths, the V and the detached lozenge; the original
       has no enclosed holes so neither does this. Measured against the source mask at
       full size: IoU 0.987, with the residual sitting as a sub-pixel hairline around the
       perimeter rather than at any feature, so nothing is clipped or rounded off.

       The tile is not decoration. The bare mark is 1.6:1, so fitted to a 16px square it
       is only 10px tall and the lozenge merges into the V's right arm. Knocked out of a
       filled tile it keeps an edge against the tab bar and stays legible. Same reasoning,
       and the same theme flip, as the wordmark favicon this replaces. -->
  <style>
    .tile { fill: #141414 }
    .mark { fill: #ffffff }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #ededed }
      .mark { fill: #141414 }
    }
  </style>
